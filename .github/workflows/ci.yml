# CI — lint, typecheck, build and the full test suite with coverage, on a
# Node 20 / 22 matrix, against a real Postgres. REQUIRE_DB=1 makes the test
# harness fail (not skip) if that Postgres is unreachable.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tenant_kit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      REQUIRE_DB: '1'
      TENANT_KIT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tenant_kit_test

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Coverage is a property of the code, not of the runtime, so it is
      # measured once. V8 attributes FUNCTION coverage differently between Node
      # 22 and 24 — on identical commits and identical passing tests, functions
      # differ by up to five points while statements and lines agree to two
      # decimals. Enforcing the threshold on both makes the gate a report on
      # whichever V8 ran, not on the tests. It runs on the newest, which is also
      # what contributors see locally.
      - name: Test (with coverage)
        if: matrix.node == 24
        run: pnpm test:coverage

      - name: Test
        if: matrix.node != 24
        run: pnpm test
